<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCE Developer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #ffffff;
        }

        /* --- Sidebar Navigation --- */
        aside {
            width: 280px;
            background-color: #e6e6e6;
            border-right: 1px solid #dcdcdc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 0 20px 0;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 500;
            line-height: 1.2;
            color: #000000;
            padding: 0 30px;
            margin-bottom: 40px;
        }

        nav {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .nav-item {
            display: block;
            padding: 15px 30px;
            font-size: 18px;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-left: 4px solid transparent;
        }

        /* Active navigation state styling */
        .nav-item.active {
            background-color: #cbeffc;
            border-left: 4px solid #5ac8fa;
            font-weight: 500;
        }

        .nav-item:hover:not(.active) {
            background-color: #dadada;
        }

        .sidebar-footer {
            font-size: 10px;
            color: #555555;
            padding: 0 20px;
        }

        /* --- Main Content Area Wrapper --- */
        main {
            margin-left: 280px; /* Leaves room for fixed sidebar */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar styled to show text on Project page */
        .top-bar {
            height: 40px;
            background-color: #ededed;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #000000;
        }

        /* Page Content Views */
        .page-view {
            display: none; /* Hidden by default */
            padding: 60px 50px;
            max-width: 1100px;
            width: 100%;
        }

        .page-view.active-view {
            display: block; /* Shown when active */
        }

        /* --- Page 1: Home View Specific Styling --- */
        .heading-container {
            position: relative;
            padding-left: 25px;
            margin-bottom: 50px;
        }

        .heading-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: 5px;
            bottom: 5px;
            width: 4px;
            background-color: #ff9500;
        }

        .heading-container::after {
            content: "";
            position: absolute;
            left: 8px;
            top: 5px;
            bottom: 5px;
            width: 4px;
            background-color: #007aff;
        }

        h1 {
            font-size: 56px;
            font-weight: 400;
            line-height: 1.15;
            color: #000000;
        }

        /* --- Cards Shared Styles --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        /* Home Layout uses automatic sizing grids */
        .home-grid {
            max-width: 800px;
        }

        .card {
            background-color: #eaeaea;
            border: 2px solid #cecece;
            border-radius: 8px;
            padding: 30px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 30px;
            color: #000000;
        }

        .card-text {
            font-size: 20px;
            line-height: 1.3;
            color: #000000;
        }

        .card-image-container {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .placeholder-svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-project-title {
            font-size: 20px;
            text-align: center;
            line-height: 1.3;
            margin-top: auto;
            color: #000000;
        }

        /* --- Page 2: Project View Specific Styling --- */
        /* Flex alignment to closely match the offset structure of the project view screenshot */
        .project-flex-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            margin-top: 20px;
        }

        .project-card-left {
            width: 320px;
            flex-shrink: 0;
        }

        .project-card-right {
            width: 320px;
            margin-top: 80px; /* Creates the staggered visual step from your screenshot */
            min-height: 480px;
            justify-content: flex-start;
            gap: 40px;
        }

        .project-text-title {
            font-size: 22px;
            color: #000000;
            text-align: center;
            width: 100%;
        }

        .project-text-sub {
            font-size: 22px;
            color: #000000;
            text-align: center;
            width: 100%;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            aside {
                width: 100%;
                position: relative;
                padding: 20px 0;
            }
            main {
                margin-left: 0;
            }
            .page-view {
                padding: 30px 20px;
            }
            h1 {
                font-size: 38px;
            }
            .project-flex-layout {
                flex-direction: column;
                align-items: stretch;
                gap: 25px;
            }
            .project-card-left, .project-card-right {
                width: 100%;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="brand-title">KCE<br>Developer</div>
            <nav>
                <div id="nav-home" class="nav-item active" onclick="switchPage('home')">Home</div>
                <div id="nav-project" class="nav-item" onclick="switchPage('project')">Project</div>
                <div id="nav-purchase" class="nav-item">Purchase</div>
            </nav>
        </div>
        <div class="sidebar-footer">
            KCE developer 2026 - All right reserve - since 2021
        </div>
    </aside>

    <main>
        <div class="top-bar" id="top-bar-text"></div>
        
        <div id="view-home" class="page-view active-view">
            <div class="heading-container">
                <h1>The future of<br>Builiding<br>Architechture</h1>
            </div>

            <div class="cards-grid home-grid">
                <div class="card">
                    <div class="card-title">Good day 🍀</div>
                    <div class="card-text">
                        As SOLO<br>
                        developer<br>
                        our project may<br>
                        take around 1 - 2<br>
                        Years
                    </div>
                </div>

                <div class="card">
                    <div class="card-image-container">
                        <svg class="placeholder-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <rect width="200" height="200" fill="#f0f0f0"/>
                            <line x1="20" y1="200" x2="50" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="180" y1="200" x2="150" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="50" y1="20" x2="150" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="20" y1="150" x2="180" y2="150" stroke="#e0e0e0" stroke-width="2"/>
                            <polygon points="100,55 145,88 128,140 72,140 55,88" fill="none" stroke="#333333" stroke-width="3"/>
                            <polygon points="100,65 137,92 123,133 77,133 63,92" fill="none" stroke="#666666" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="card-project-title">
                        our latest project<br>Pentagon HQ
                    </div>
                </div>
            </div>
        </div>

        <div id="view-project" class="page-view">
            <div class="project-flex-layout">
                
                <div class="card project-card-left">
                    <div class="card-image-container">
                        <svg class="placeholder-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <rect width="200" height="200" fill="#f0f0f0"/>
                            <line x1="20" y1="200" x2="50" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="180" y1="200" x2="150" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="50" y1="20" x2="150" y2="20" stroke="#d0d0d0" stroke-width="2"/>
                            <line x1="20" y1="150" x2="180" y2="150" stroke="#e0e0e0" stroke-width="2"/>
                            <polygon points="100,55 145,88 128,140 72,140 55,88" fill="none" stroke="#333333" stroke-width="3"/>
                            <polygon points="100,65 137,92 123,133 77,133 63,92" fill="none" stroke="#666666" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="card-project-title">
                        our latest project<br>Pentagon HQ
                    </div>
                </div>

                <div class="card project-card-right">
                    <div class="project-text-title">Aqua city center</div>
                    <div class="project-text-sub">M4 ESC TP</div>
                    <div class="project-text-sub">M3 ESC TP</div>
                </div>

            </div>
        </div>
    </main>

    <script>
        function switchPage(pageId) {
            // Remove active classes from navigation items
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-project').classList.remove('active');

            // Remove active classes from page views
            document.getElementById('view-home').classList.remove('active-view');
            document.getElementById('view-project').classList.remove('active-view');

            // Configure layout according to the selected view
            const topBar = document.getElementById('top-bar-text');
            
            if (pageId === 'home') {
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('view-home').classList.add('active-view');
                topBar.innerText = ""; // Home page keeps top bar blank
            } else if (pageId === 'project') {
                document.getElementById('nav-project').classList.add('active');
                document.getElementById('view-project').classList.add('active-view');
                topBar.innerText = "Project"; // Project page populates header indicator text
            }
        }
    </script>
</body>
</html>
